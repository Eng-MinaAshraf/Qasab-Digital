<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Rich sugarcane juice liquid gradient -->
    <linearGradient id="juiceLiquidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef23a" />
      <stop offset="25%" stop-color="#9edc20" />
      <stop offset="65%" stop-color="#72b814" />
      <stop offset="100%" stop-color="#448408" />
    </linearGradient>

    <!-- Specular glass highlight gradient -->
    <linearGradient id="glassWallReflect" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="18%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="88%" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.65" />
    </linearGradient>

    <!-- Frothy head / foam on freshly poured sugarcane juice -->
    <linearGradient id="cremaFoamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#f5fad2" />
      <stop offset="100%" stop-color="#d6f194" />
    </linearGradient>

    <!-- Crystal clear ice cube gradient -->
    <linearGradient id="iceCubeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92" />
      <stop offset="40%" stop-color="#e8f8ec" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#9ddc55" stop-opacity="0.65" />
    </linearGradient>

    <!-- Fresh juice splash droplet gradient -->
    <radialGradient id="juiceDropGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f5ffdb" />
      <stop offset="45%" stop-color="#b6f035" />
      <stop offset="100%" stop-color="#559910" />
    </radialGradient>

    <!-- Fresh mint leaves gradient -->
    <linearGradient id="mintLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5ec024" />
      <stop offset="100%" stop-color="#245c08" />
    </linearGradient>

    <filter id="glass3DShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0a1f02" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- RISING PARTICLES & FRESH JUICE DROPLETS -->
  <g class="juice-particles">
    <circle cx="105" cy="45" r="8" fill="url(#juiceDropGrad)" />
    <circle cx="295" cy="30" r="10" fill="url(#juiceDropGrad)" />
    <circle cx="60" cy="120" r="6" fill="url(#juiceDropGrad)" />
    <circle cx="340" cy="100" r="7.5" fill="url(#juiceDropGrad)" />
    <circle cx="200" cy="15" r="5.5" fill="url(#juiceDropGrad)" />

    <!-- Crisp sparkle stars -->
    <path d="M 75 60 Q 75 72 63 72 Q 75 72 75 84 Q 75 72 87 72 Q 75 72 75 60 Z" fill="#dfff75" />
    <path d="M 320 45 Q 320 57 308 57 Q 320 57 320 69 Q 320 57 332 57 Q 320 57 320 45 Z" fill="#dfff75" />
  </g>

  <!-- MAIN GLASS OF FRESH SUGARCANE JUICE (Fills height from top to base) -->
  <g filter="url(#glass3DShadow)">
    <!-- Rear glass wall with fresh tint -->
    <path d="M 95 85 L 128 385 C 132 398, 268 398, 272 385 L 305 85 Z" fill="#e8f5df" opacity="0.25" />

    <!-- Natural Sugarcane Straw / Stirrer (tilted inside glass) -->
    <g transform="rotate(13 200 200)">
      <rect x="190" y="8" width="20" height="360" rx="8" fill="#88c322" stroke="#42700a" stroke-width="2" />
      <line x1="190" y1="75" x2="210" y2="75" stroke="#42700a" stroke-width="2.5" />
      <line x1="190" y1="155" x2="210" y2="155" stroke="#42700a" stroke-width="2.5" />
      <line x1="190" y1="235" x2="210" y2="235" stroke="#42700a" stroke-width="2.5" />
      <line x1="190" y1="315" x2="210" y2="315" stroke="#42700a" stroke-width="2.5" />
      <!-- Cut top of straw -->
      <ellipse cx="200" cy="11" rx="10" ry="5.5" fill="#fbf7d2" stroke="#42700a" stroke-width="1.8" />
    </g>

    <!-- JUICE LIQUID BODY -->
    <path d="M 98 124 C 135 128, 175 120, 220 126 C 260 130, 285 123, 302 124 L 270 384 C 267 394, 133 394, 130 384 Z" fill="url(#juiceLiquidGrad)" />

    <!-- Dynamic wave highlight inside juice -->
    <path d="M 98 124 C 130 118, 175 132, 218 122 C 262 112, 284 126, 302 124 C 302 136, 278 144, 222 137 C 178 144, 128 131, 98 137 Z" fill="#bbee38" opacity="0.88" />

    <!-- FLOATING CRYSTALLINE ICE CUBES -->
    <!-- Large Ice Cube 1 -->
    <polygon points="128,140 168,128 190,150 150,165" fill="url(#iceCubeGrad)" stroke="#ffffff" stroke-width="2" />
    <!-- Large Ice Cube 2 -->
    <polygon points="212,152 254,140 274,164 232,179" fill="url(#iceCubeGrad)" stroke="#ffffff" stroke-width="2" />
    <!-- Mid Ice Cube 3 -->
    <polygon points="156,202 192,193 208,215 172,226" fill="url(#iceCubeGrad)" stroke="#ffffff" stroke-width="1.8" opacity="0.9" />

    <!-- EFFERVESCENT BUBBLES IN FRESH CANE JUICE -->
    <circle cx="138" cy="245" r="6.5" fill="#f3ffcc" opacity="0.9" />
    <circle cx="155" cy="318" r="5" fill="#f3ffcc" opacity="0.75" />
    <circle cx="182" cy="274" r="7" fill="#f3ffcc" opacity="0.95" />
    <circle cx="238" cy="302" r="5.5" fill="#f3ffcc" opacity="0.85" />
    <circle cx="250" cy="235" r="6.5" fill="#f3ffcc" opacity="0.9" />
    <circle cx="210" cy="352" r="4.5" fill="#f3ffcc" opacity="0.7" />
    <circle cx="254" cy="362" r="5" fill="#f3ffcc" opacity="0.8" />

    <!-- THICK FROTHY FOAM LAYER (Natural rich cane crema) -->
    <path d="M 96 115 C 110 106, 134 104, 156 108 C 184 103, 218 103, 246 107 C 274 102, 296 106, 304 115 C 302 133, 98 133, 96 115 Z" fill="url(#cremaFoamGrad)" />
    <ellipse cx="200" cy="115" rx="104" ry="16" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.85" />

    <!-- OUTER GLASS WALL REFLECTIONS & HIGH-CONTRAST CONTOURS -->
    <path d="M 95 85 L 128 385 C 132 398, 268 398, 272 385 L 305 85 Z" fill="url(#glassWallReflect)" stroke="#ffffff" stroke-width="3.5" stroke-opacity="0.92" />

    <!-- Glass Rim Oval Lip -->
    <ellipse cx="200" cy="85" rx="105" ry="18" fill="none" stroke="#ffffff" stroke-width="3.8" stroke-opacity="0.98" />
    <ellipse cx="200" cy="85" rx="103" ry="16" fill="#ffffff" fill-opacity="0.1" />

    <!-- Specular Light Streaks down glass -->
    <path d="M 107 108 L 134 374" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.75" />
    <path d="M 116 108 L 141 368" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.45" />
    <path d="M 293 108 L 266 374" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.5" />

    <!-- Glass Base Rim Ring -->
    <ellipse cx="200" cy="385" rx="72" ry="11" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.85" />

    <!-- FRESH CRISP MINT SPRIG ON RIM -->
    <g transform="translate(100, 86) rotate(-28)">
      <path d="M 0 0 C -22 -26, -52 -22, -62 -2 C -52 18, -22 16, 0 0 Z" fill="url(#mintLeafGrad)" stroke="#1a4605" stroke-width="1.5" />
      <path d="M 0 0 C 4 -32, -14 -52, -38 -46 C -42 -26, -18 -12, 0 0 Z" fill="url(#mintLeafGrad)" stroke="#1a4605" stroke-width="1.5" />
      <path d="M 0 0 L -44 -14" stroke="#92f54a" stroke-width="1.8" fill="none" />
    </g>
  </g>
</svg>
